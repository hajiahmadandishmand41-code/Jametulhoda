name: PHP and PostgreSQL checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jhd_test
          POSTGRES_USER: jhd_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: jhd_legacy
          MARIADB_USER: jhd_test
          MARIADB_PASSWORD: jhd_test
          MARIADB_ROOT_PASSWORD: root_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://jhd_test@127.0.0.1:5432/jhd_test?sslmode=disable
      SESSION_DRIVER: database
      UPLOAD_STORAGE: local
      SITE_URL: https://example.test
      TEST_ADMIN_USERNAME: ci_admin
      ADMIN_USERNAME: ci_admin
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          ini-values: opcache.jit=0, opcache.jit_buffer_size=0, output_buffering=4096
          extensions: pdo_pgsql, pdo_mysql, mbstring, fileinfo, gd, dom, curl, zip
          tools: composer:v2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Validate and install PHP dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-dev 2>&1 | tee /tmp/composer-install.log
      - run: find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l
      # Static route/link audit: resolves every URL in config/routes.php (routes,
      # aliases, patterns) and every internal link found in the templates without
      # needing a server. It fails fast when a route is added for a path that the
      # HTTP tests require to stay 404 (for example the legacy root /install.php).
      - name: Static route and link audit
        run: |
          python3 tests/verify_routes.py
          python3 tests/crawl_links.py
      - run: php tests/security.php && php bin/migrate.php && php bin/migrate.php
      - name: Legacy MariaDB identity migration
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: jhd_legacy
          DB_USER: jhd_test
          DB_PASS: jhd_test
        run: php tests/legacy-mysql.php
      - name: Upload rollback and durable cleanup
        run: ALLOW_DESTRUCTIVE_TESTS=1 php tests/storage-recovery.php
      - name: Temporary test administrator
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "TEST_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          ADMIN_PASSWORD="$password" php bin/create-admin.php
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Integration and browser tests
        run: |
          php -S 0.0.0.0:8080 router.php > test-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8080/ > /dev/null
          npm run test:http 2>&1 | tee /tmp/http-tests.log
          # Unified identity end-to-end matrix (A–X): registration, single login
          # page for members/staff, role redirects, password change, RBAC gates,
          # uploads, content creation, 404s, session hardening.
          node tests/auth-flows.mjs 2>&1 | tee /tmp/auth-flows.log
          node tests/route-smoke.mjs 2>&1 | tee /tmp/route-smoke.log
          node tests/route-matrix.mjs 2>&1 | tee /tmp/route-matrix.log
          npm run test:browser 2>&1 | tee /tmp/browser-tests.log
          node tests/links.mjs 2>&1 | tee /tmp/link-tests.log
          if grep -Ei "PHP (Warning|Fatal|Parse)|Application failure|Upload failed" test-server.log; then exit 1; fi
          # `tee` swallows the suite exit codes, so a FAIL line has to be caught here too
          # (the container step below already does the same for Apache).
          for log in /tmp/http-tests.log /tmp/auth-flows.log /tmp/route-smoke.log /tmp/route-matrix.log /tmp/browser-tests.log /tmp/link-tests.log; do
            if grep -q "FAIL" "$log"; then
              echo "::error title=Integration FAIL::$(grep FAIL "$log" | head -n 20 | tr '\n' ' ' | cut -c1-800)"
              exit 1
            fi
          done
      - name: Pretty URL mode verification
        run: |
          # JHD_PRETTY_URLS=true exercises the mod-rewrite URL scheme: url() emits
          # pretty paths and router.php must resolve every route without ever
          # leaking an internal PHP file. Query mode remains the guaranteed
          # contract; this proves the optional pretty scheme is equally sound.
          JHD_PRETTY_URLS=true php -S 0.0.0.0:8082 router.php > pretty-server.log 2>&1 &
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8082/ > /dev/null
          TEST_BASE_URL=http://127.0.0.1:8082 node tests/route-matrix.mjs 2>&1 | tee /tmp/route-matrix-pretty.log
          TEST_BASE_URL=http://127.0.0.1:8082 node tests/route-smoke.mjs 2>&1 | tee /tmp/route-smoke-pretty.log
          if grep -Ei "PHP (Warning|Fatal|Parse)|Application failure|Upload failed" pretty-server.log; then exit 1; fi
          for log in /tmp/route-matrix-pretty.log /tmp/route-smoke-pretty.log; do
            if grep -q "FAIL" "$log"; then
              echo "::error title=Pretty URL FAIL::$(grep FAIL "$log" | head -n 20 | tr '\n' ' ' | cut -c1-800)"
              exit 1
            fi
          done
      - name: Failure diagnostics
        if: failure()
        run: |
          python3 - <<'PYTHON'
          import pathlib
          for name in ['/tmp/http-tests.log','/tmp/auth-flows.log','/tmp/route-smoke.log','/tmp/route-matrix.log','/tmp/browser-tests.log','/tmp/link-tests.log','test-server.log']:
              path=pathlib.Path(name)
              if path.exists():
                  lines=[line for line in path.read_text().splitlines() if any(word in line for word in ['FAIL','Fatal','Warning','Error','failure','exceeded','status','path','checked'])]
                  message=' | '.join(lines)[-3000:].replace('%','%25').replace('\n','%0A')
                  if message: print('::error title=Test diagnostics::'+message)
          PYTHON
      - name: Container build
        run: docker build -f Dockerfile.vercel -t jametulhoda:test .
      - name: Container runtime on custom PORT
        run: |
          docker run -d --name jhd-container --network host -e PORT=8081 -e APP_ENV=development -e DATABASE_URL -e SESSION_DRIVER -e UPLOAD_STORAGE -e UPLOAD_LOCAL_PATH=/tmp/jhd-uploads -e SITE_URL jametulhoda:test
          trap 'docker logs jhd-container > container-server.log 2>&1; docker rm -f jhd-container' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail --silent http://127.0.0.1:8081/ > /dev/null
          TEST_BASE_URL=http://127.0.0.1:8081/ npm run test:http 2>&1 | tee /tmp/http-8081.log
          TEST_BASE_URL=http://127.0.0.1:8081/ node tests/route-smoke.mjs 2>&1 | tee /tmp/route-smoke-8081.log
          if grep -q "FAIL" /tmp/route-smoke-8081.log; then cat /tmp/route-smoke-8081.log; exit 1; fi
          docker exec jhd-container sh -c "printf '%s' '<?php echo \"ROUTE_PROBE_EXECUTED\"; ?>' > /var/www/html/uploads/route-probe.php"
          probe_status=$(curl --silent --output /tmp/upload-route-probe --write-out '%{http_code}' http://127.0.0.1:8081/uploads/route-probe.php)
          if [ "$probe_status" != 404 ] || grep -Eq 'ROUTE_PROBE_EXECUTED|<\?php' /tmp/upload-route-probe; then echo "Unsafe uploaded PHP route: HTTP $probe_status"; exit 1; fi
          TEST_BASE_URL=http://127.0.0.1:8081/ npm run test:browser 2>&1 | tee /tmp/browser-8081.log
          docker logs jhd-container > container-server.log 2>&1
          echo "--- container-server.log start ---"; cat container-server.log; echo "--- end ---"
          echo "--- http-8081.log ---"; cat /tmp/http-8081.log; echo "--- end http ---"
          if grep -Ei "PHP (Warning|Fatal|Parse)|Application failure|Upload failed" container-server.log; then echo "Found warning in container"; cat container-server.log; exit 1; fi
          if grep -q "FAIL" /tmp/http-8081.log; then
            echo "::error title=HTTP 8081 FAIL::$(grep FAIL /tmp/http-8081.log | head -n 20 | tr '\n' ' ' | cut -c1-800)"
            cat /tmp/http-8081.log
            exit 1
          fi
          if grep -q "FAIL" /tmp/browser-8081.log; then
            echo "::error title=Browser 8081 FAIL::$(grep FAIL /tmp/browser-8081.log | head -n 20 | tr '\n' ' ' | cut -c1-800)"
            cat /tmp/browser-8081.log
            exit 1
          fi
      - name: Container logs diagnostics
        if: failure()
        run: |
          echo "::group::container-server.log"
          cat container-server.log || echo "no container log"
          echo "::endgroup::"
          if [ -f container-server.log ]; then
            head -n 100 container-server.log | tr '\n' ' ' | sed 's/%/%25/g' | sed 's/\r/%0D/g' | xargs -I {} echo "::error title=Container log::{} "
          fi
          if [ -f /tmp/http-8081.log ]; then
            head -n 50 /tmp/http-8081.log | tr '\n' ' ' | sed 's/%/%25/g' | xargs -I {} echo "::error title=HTTP 8081 log::{} "
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification
          path: |
            test-results/
            test-server.log
            pretty-server.log
            container-server.log
            composer.lock
